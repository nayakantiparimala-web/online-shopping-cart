<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Shopping Cart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            font-weight: bold;
            margin: 10px;
        }

        button {
            padding: 10px 15px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .cart {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        .remove {
            background: red;
        }

        #total {
            font-size: 22px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Online Shopping Cart</h1>
    <p>Full Stack Development Project</p>
</header>

<div class="container">

    <h2>Products</h2>

    <div class="products">

        <div class="product">
            <h3>Laptop</h3>
            <p class="price">₹50000</p>
            <button onclick="addToCart('Laptop', 50000)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <h3>Mobile Phone</h3>
            <p class="price">₹20000</p>
            <button onclick="addToCart('Mobile Phone', 20000)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <h3>Headphones</h3>
            <p class="price">₹2000</p>
            <button onclick="addToCart('Headphones', 2000)">
                Add to Cart
            </button>
        </div>

    </div>

    <div class="cart">

        <h2>Shopping Cart 🛒</h2>

        <div id="cartItems"></div>

        <hr>

        <p id="total">Total: ₹0</p>

        <button onclick="checkout()">Checkout</button>

    </div>

</div>

<script>

    let cart = [];

    function addToCart(name, price) {

        let item = {
            name: name,
            price: price
        };

        cart.push(item);

        displayCart();
    }

    function displayCart() {

        let cartItems =
            document.getElementById("cartItems");

        cartItems.innerHTML = "";

        let total = 0;

        cart.forEach(function(item, index) {

            total += item.price;

            let div =
                document.createElement("div");

            div.className = "cart-item";

            div.innerHTML = `
                <span>
                    ${item.name} - ₹${item.price}
                </span>

                <button
                    class="remove"
                    onclick="removeItem(${index})">
                    Remove
                </button>
            `;

            cartItems.appendChild(div);
        });

        document.getElementById("total").innerText =
            "Total: ₹" + total;
    }

    function removeItem(index) {

        cart.splice(index, 1);

        displayCart();
    }

    function checkout() {

        if (cart.length === 0) {
            alert("Your cart is empty!");
            return;
        }

        alert("Order placed successfully!");

        cart = [];

        displayCart();
    }

</script>

</body>
</html>
